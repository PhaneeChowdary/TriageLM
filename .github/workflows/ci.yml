# Lint and unit tests. Training needs a GPU and runs on Kaggle, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.11 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/pytest
